# /etc/mosquitto/conf.d/beacon.conf   (mosquitto 2.0.18 on the hub)
#
# Before this file existed mosquitto ran its implicit default listener:
# 127.0.0.1:1883, anonymous, no ACL. Declaring ANY listener replaces that
# default, so loopback is declared here explicitly or it would vanish.
#
# One policy for both listeners (no per_listener_settings): this assumes
# nothing else on the hub used the broker before beacon (no connected
# clients, empty persistence db). If something did, give it a login or
# switch to per_listener_settings. The service logs in as beacon-svc, the
# devices as beacon-dev, and an anonymous process on the hub cannot fire
# or watch the beacon.
#
# LAN_IP is the hub's LAN address, the one devices reach. Install with:
#   sed "s/LAN_IP/192.0.2.10/" deploy/mosquitto-beacon.conf | sudo tee /etc/mosquitto/conf.d/beacon.conf

listener 1883 127.0.0.1
listener 1883 LAN_IP

allow_anonymous false
password_file /etc/mosquitto/beacon.passwd
acl_file /etc/mosquitto/beacon.acl
