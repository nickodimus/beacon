# /etc/mosquitto/conf.d/beacon.conf   (mosquitto 2.0.18 on hub)
#
# Before this file existed mosquitto ran its implicit default listener:
# 127.0.0.1:1883, anonymous, no ACL. Declaring ANY listener replaces that
# default, so loopback is declared here explicitly or it would vanish.
#
# One policy for both listeners (no per_listener_settings): nothing on
# hub used the broker before beacon (no connected clients, empty
# persistence db, checked 2026-10-19), so there is no anonymous client to
# keep working. The service logs in as beacon-svc, the devices as
# beacon-dev, and an anonymous process on hub — including the root
# <api-host> app — cannot fire or watch the beacon.

listener 1883 127.0.0.1
listener 1883 192.0.2.10

allow_anonymous false
password_file /etc/mosquitto/beacon.passwd
acl_file /etc/mosquitto/beacon.acl
