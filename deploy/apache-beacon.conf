# Snippet for /etc/apache2/sites-enabled/<api-host>-le-ssl.conf.
#
# Paste these lines INSIDE <VirtualHost *:443>, directly ABOVE the existing
#     ProxyPass / http://127.0.0.1:8000/
# Apache matches ProxyPass directives in the order written, so the /beacon
# block has to come before the catch-all or the old GPIO app on :8000
# gets the request.
#
# The app serves its routes with the /beacon prefix already, so no rewrite:
# https://<api-host>/beacon/trigger -> http://127.0.0.1:8012/beacon/trigger

    ProxyPass        /beacon http://127.0.0.1:8012/beacon
    ProxyPassReverse /beacon http://127.0.0.1:8012/beacon
